services:
  cinema-ai-dub:
    build:
      context: .
      dockerfile: Dockerfile
    image: cinema-ai-dub:local
    container_name: cinema-ai-dub
    restart: unless-stopped
    ports:
      - "4001:4001"
    volumes:
      # Existing projects, uploads, database and model cache stay on the host.
      - ./data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:4001,http://127.0.0.1:4001
      TRANSCRIPTION_DEVICE: cpu
      DIARIZATION_DEVICE: cpu
      TRANSLATION_DEVICE: cpu
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4001/api/v1/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
